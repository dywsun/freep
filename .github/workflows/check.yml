name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check frontend/app.js && node --check frontend/live.js && node --check frontend/share.js && node --check frontend/monitor.js
      - run: node tests/test_qr.cjs
      - run: node tests/test_traffic.cjs
      - run: python scripts/build_worker.py
      - run: node --check worker-panel/app.js && node --check worker-service/src/worker.js
      - run: node tests/test_worker.mjs
      - run: bash -n install.sh scripts/build-sing-box.sh scripts/install-kernel.sh
